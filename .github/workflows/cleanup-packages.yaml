name: Cleanup old package versions

# Deletes package versions for real unless dry-run is on.
on:
  workflow_dispatch:
    inputs:
      keep-count:
        description: Versions to keep per package, per channel (stable and preview counted separately)
        required: false
        default: "10"
        type: string
      dry-run:
        description: List what would be deleted without deleting it
        required: false
        default: true
        type: boolean

permissions:
  packages: write

jobs:
  cleanup:
    strategy:
      fail-fast: false
      matrix:
        package-id:
          - Aurore.Foundation.Core
          - Aurore.Foundation.AspNetCore
          - Aurore.Foundation.OpenApi
          - Aurore.Foundation.OpenApi.Scalar
          - Aurore.Foundation.OpenApi.Swagger
          - Aurore.Foundation.Telemetry
          - Aurore.Foundation.EntityFrameworkCore
          - Aurore.Foundation.EntityFrameworkCore.Postgres
          - Aurore.Foundation.EntityFrameworkCore.SqlServer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete old versions
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_ID: ${{ matrix.package-id }}
          KEEP: ${{ inputs.keep-count }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: bash .github/workflows/scripts/delete-old-package-versions.sh
