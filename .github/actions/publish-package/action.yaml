name: Publish package
description: >
  Pushes the packages in ./nupkg (made by pack-package) to a NuGet feed (nuget.org by default).
  The symbol package (.snupkg) next to each one goes with it, so the package can be debugged.
  A version that already exists in the feed fails the step.

inputs:
  api-key:
    description: Key of the feed. For nuget.org, the short-lived key that NuGet/login returns for the trusted publishing policy (its NUGET_API_KEY output).
    required: true
  source:
    description: URL of the feed. Defaults to nuget.org.
    required: false
    default: https://api.nuget.org/v3/index.json

runs:
  using: composite
  steps:
    - name: Push
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
        SOURCE: ${{ inputs.source }}
      run: dotnet nuget push "./nupkg/*.nupkg" --api-key "$API_KEY" --source "$SOURCE"
