name: Conventional commits
description: >
  Fails when a commit between two SHAs (merges excluded), or the pull request title when given, does not follow Conventional Commits (https://www.conventionalcommits.org/en/v1.0.0/).
  The checkout must have the full history (fetch-depth: 0).

inputs:
  base-sha:
    description: Commit SHA to diff from (exclusive).
    required: true
  head-sha:
    description: Commit SHA to diff to (inclusive).
    required: true
  title:
    description: Pull request title, checked with the same rule. Left out, only the commits are checked.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate commit messages
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        TITLE: ${{ inputs.title }}
      run: bash "${{ github.action_path }}/../../workflows/scripts/validate-conventional-commits.sh"
