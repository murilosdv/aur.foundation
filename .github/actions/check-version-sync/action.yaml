name: Check package/version sync
description: >
  Reads the version of a package from Versions.props and fails unless a change under src/<Package> and a change of that version happen in the same diff,
  and CHANGELOG.md has the first entry "## [<Package>-<version>]" of the package for that version, once.
  Used by the pull request check and by the publish pipeline, so the rule is defined once.

inputs:
  package-name:
    description: Package name, as in the folder src/<name> (for example "Core" or "EntityFrameworkCore.Postgres").
    required: true
  base-sha:
    description: Commit SHA to diff from. Must exist (the base-sha output of detect-changed-packages).
    required: true
  head-sha:
    description: Commit SHA to diff to.
    required: true
  skip-check:
    description: If 'true', only read the version and skip the validation.
    required: false
    default: "false"

outputs:
  version:
    description: The version in Versions.props for this package at head-sha.
    value: ${{ steps.check.outputs.version }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        PACKAGE: ${{ inputs.package-name }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        SKIP: ${{ inputs.skip-check }}
      run: bash "${{ github.action_path }}/../../workflows/scripts/check-version-sync.sh"
